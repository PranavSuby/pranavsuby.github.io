<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale/user-scalable=no stops iOS from auto-zooming when a focused
         input is < 16px. Safe here: standalone PWA has no pinch-zoom UI anyway. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tools" />
    <meta name="description" content="Pranav's web apps — gym tracker, food diary, and more." />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png?v=2" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <title>Pranav's Tools</title>
    <script>
      /* iOS standalone PWAs report a short viewport on cold launch (a race with the
         status-bar/safe-area settling), leaving fixed bottom bars too high. We measure
         the LARGE viewport (100lvh, the static full-screen height) via a hidden probe,
         take the max with innerHeight so it can't come out short, pin it to --app-h,
         and re-measure on every settle signal + a few delayed ticks. lvh ignores the
         soft keyboard, so typing won't shrink the layout. */
      (function () {
        var d = document.documentElement;
        var probe;
        function measure() {
          var lvh = 0;
          if (document.body) {
            if (!probe) {
              probe = document.createElement('div');
              probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100lvh;visibility:hidden;pointer-events:none;';
              document.body.appendChild(probe);
            }
            lvh = probe.getBoundingClientRect().height;
          }
          var h = Math.max(window.innerHeight || 0, lvh || 0);
          if (h) d.style.setProperty('--app-h', h + 'px');
        }
        measure();
        window.addEventListener('resize', measure);
        window.addEventListener('orientationchange', measure);
        window.addEventListener('pageshow', measure);
        window.addEventListener('focus', measure);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) measure(); });
        if (window.requestAnimationFrame) requestAnimationFrame(measure);
        [60, 150, 300, 600, 1000, 1500].forEach(function (t) { setTimeout(measure, t); });
      })();
    </script>
    <script>
      // Restore path from 404.html redirect query string
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
